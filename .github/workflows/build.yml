name: Build APK
on:
  workflow_dispatch: {}
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Find the Android project (unzips an uploaded .zip automatically)
        id: find
        run: |
          echo "Files in the repository:"; ls -la
          F=$(find . -maxdepth 4 -name settings.gradle.kts -not -path "./_unzipped/*" | head -1)
          if [ -z "$F" ]; then
            Z=$(find . -maxdepth 2 -iname "*.zip" | head -1)
            if [ -n "$Z" ]; then
              echo "Found a zip file ($Z). Unzipping it."
              mkdir -p _unzipped && unzip -q -o "$Z" -d _unzipped
              F=$(find _unzipped -maxdepth 5 -name settings.gradle.kts | head -1)
            fi
          fi
          if [ -z "$F" ]; then echo "::error::The Android project was not found. Upload the AsiaPay-listener-app zip file (or its extracted files) to the repository."; exit 1; fi
          D=$(dirname "$F"); echo "Project folder: $D"; ls -la "$D" "$D/app"
          echo "dir=$D" >> "$GITHUB_OUTPUT"
      - name: Build release and debug APKs
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace
      - name: Collect APKs
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/AsiaPayListener-release.apk
          cp app/build/outputs/apk/debug/*.apk dist/AsiaPayListener-debug.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: AsiaPayListener-apk
          path: "**/dist/*.apk"
          if-no-files-found: error
          retention-days: 30
